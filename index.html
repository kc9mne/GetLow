<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GetLow</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">Get<b>Low</b></div>
    <nav id="ptabs" class="ptabs" aria-label="Open projects"></nav>
    <button id="newproj" class="btn ptab-add" title="New project" aria-label="New project">+</button>
    <div class="spacer"></div>
    <label class="topfield">Units
      <select id="units"><option value="imperial">Inches / ft³</option><option value="metric">cm / liters</option></select>
    </label>
    <button id="open" class="btn">Open…</button>
    <button id="save" class="btn">Save project</button>
    <input id="openfile" type="file" accept=".json" multiple hidden>
  </header>

  <section id="welcome" class="welcome" hidden>
    <div class="welcome-card">
      <h2>Start a project</h2>
      <p class="hint">Each project opens in its own tab at the top. Tick tabs to put up to four projects on the graphs together.</p>
      <div class="btnrow">
        <button id="wnew" class="btn primary">New project…</button>
        <button id="wopen" class="btn">Open a project file…</button>
      </div>
    </div>
  </section>

  <div class="layout">
    <aside class="side">
      <nav id="tabs" class="tabs" role="tablist"></nav>
      <div id="panel" class="panel"></div>
    </aside>

    <main class="main">
      <h1 id="title" class="title"></h1>
      <div id="summary" class="summary"></div>
      <nav id="viewtabs" class="tabs viewtabs" role="tablist" aria-label="Views"></nav>
      <div class="views">
        <section class="card chart-card">
          <div class="chart-head">
            <nav id="chart-tabs" class="tabs small"></nav>
            <div class="spacer"></div>
            <label id="contrib" class="check"><input id="contrib-cb" type="checkbox"> Show each radiator</label>
            <button id="snap" class="btn" title="Save this design to the Compare tab and show it on the graph">Save to compare</button>
            <button id="clearsnap" class="btn ghost" title="Hide every compared curve (they stay saved)">Hide compared</button>
          </div>
          <div id="chart" class="chart-host"></div>
          <div id="warnings" class="warnings"></div>
        </section>
        <section class="card view-card">
          <div class="chart-head">
            <h3>3D view</h3>
            <div class="spacer"></div>
            <label class="check"><input id="xray" type="checkbox"> X-ray</label>
            <label class="check"><input id="explode" type="checkbox"> Explode</label>
          </div>
          <div id="view3d" class="view-host"></div>
          <div id="dims3d" class="dims3d"></div>
          <p class="hint">Drag to rotate, scroll to zoom.</p>
        </section>
        <section id="arraysum" class="card arraysum" hidden></section>
      </div>
      <div id="viewpane" class="viewpane" hidden></div>
    </main>
  </div>
  <div class="dropmask">Drop .wdr driver files or a GetLow project</div>
  <dialog id="importdlg" class="dlg"></dialog>
  <dialog id="newdlg" class="dlg newdlg"></dialog>

  <script src="js/util.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/drivers.js"></script>
  <script src="js/specparse.js"></script>
  <script src="js/enclosures.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/placement.js"></script>
  <script src="js/optimize.js"></script>
  <script src="js/match.js"></script>
  <script src="js/catalogue.js"></script>
  <script src="js/measure.js"></script>
  <script src="js/acoustics.js"></script>
  <script src="js/linearray.js"></script>
  <script src="js/room.js"></script>
  <script src="js/buildsheet.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/view3d.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
